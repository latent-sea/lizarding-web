# Hanoi "The Tower" - SIGNATURE (T-586 / D-203), band 100-200.
#
# Roster: "A high stacked vertical straight-up race." Ian 2026-08-28: "A tower
# with 5 different ladders each 10m right next to each other. The first with
# rungs P0 the next P25 the next P50 and the next P75 and the last P95."
#
# FIVE PARALLEL LADDERS, GRADED BY RUNG HEIGHT - the canyon's idea stood upright.
# Every column climbs the same 40 m; they differ only in how big each step is, so
# a lizard picks the hardest ladder it can actually climb and pays in rungs for
# anything easier. Rung heights are read off the pooled step-up census (10,400
# samples, 800 bodies x 13 ages); the P is the share of the field SHUT OUT:
#
#   column   P     rung     climbs it    rungs to the top
#     1    P0     1.4 m     100%           29
#     2    P25    2.0 m      75%           20
#     3    P50    2.2 m      50%           19
#     4    P75    2.4 m      25%           17
#     5    P95    3.2 m       5%           13
#
# NOTE THE MIDDLE THREE ARE NEARLY THE SAME GATE. Step-up capability is tightly
# clustered - P25/P50/P75 are 2.0 / 2.2 / 2.4 m - so columns 2-4 sort weakly and
# the real decision is column 1 against column 5. That is a property of the
# population, not of the build: the honest spread is 1.4 m vs 3.2 m.
#
# THE FINISH IS AT THE TOWER'S FAR TOP RIGHT (Ian), directly above the hardest
# ladder, and that is what makes the grading a TRADE rather than a pure gate:
# column 5 is both the steepest climb AND the shortest line to the flag, while
# column 1 is climbable by anyone but lands you 50 m of summit away from it.
# A centre finish (the first cut) gave the easy ladder no penalty at all.
#
# NOTE THE SHAFTS ARE OPEN TO EACH OTHER - no dividers (Ian). Adjacent columns
# are laterally linked: a hop from one column's rung to the next is a ~10 m gap
# at a ~2 m rise, a P50 jump, so roughly half the field CAN weave between shafts
# and take whichever rung is cheapest at each level. The tower is therefore a
# graded lattice rather than five sealed ladders - deliberate.
#
# Rungs are stacked FLUSH within a column (legal since T-593 discharged the
# stagger rule). Rock ground, wood rungs and platform per D-202's Hanoi
# character - hard rock ground, wood and rock platforms, lots of verticality.
# Name = MEASURED distance: finish_x tuned by probe.

