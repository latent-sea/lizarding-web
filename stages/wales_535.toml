# Wales-535 - roster baseline, band 500-600 (T-586 / D-203).
# REBALANCED FLAT (T-659, Ian 2026-10-25). The nineteen-shelf mountain is gone; what is
# left is the valley it stood in: dirt approaches at both ends and the mud gully between
# them, all at grade. A long flat for stayers where the mud is the sort: dirt 55% / mud
# 45%, a ratio no other flat carries (wales_335 is 75/25 at 335 m). Nothing to mount, so
# nothing is jumped. Name = MEASURED distance: finish_x kept from the probed build.

