# T-658 (Ian, 2026-11-01: redesign the stages over 50% DNF): STEPS 1.55 m, TIERS 15.5 m, same plan and widths.
# Under the body map a jump can fall to 4.0 m/s (rung 0), which mounts 4.0^2/9.81 = 1.63 m; the old 1.7 m step
# stranded every lizard that had dropped there (3% finished, drop fully on; 100% at 1.55). The map's top launch
# is 11.6 m/s, which mounts 13.7 m, so a 15.5 m tier still cannot be mounted straight and the hairpins hold.
# The heights in the notes below are the stage before this change.
#
# Death Valley "The Pyramid" - SIGNATURE (T-586 / D-203), band 600-700.
#
# Roster: "A stepped pyramid climbed switchback - the field runs left to right
# repeatedly, reversing at every tier." Ian 2026-08-28, rejecting a first cut
# that split the climb from each tier's MIDDLE: "it is all jump and no running...
# They start bottom left then run to right - the stairs there go out to the right
# then back to the left to get to the next stage, they then have to run over the
# left where the double back stairs happen again - and so on."
#
# THE STAIRS ARE HAIRPINS AT THE TIER ENDS, NOT A V AT THE MIDDLE. That is the
# whole difference: a middle-split makes every leg a HALF tier and the stage
# becomes climbing with running in between. An end hairpin goes OUT past the tier
# edge, doubles BACK inward, and delivers the lizard one tier up AT THE SAME END -
# so it sets off across the FULL width the other way. Running dominates and the
# reversals are the punctuation.
#
# TIERS ARE 17 m APART AND THAT IS LOAD-BEARING. A switchback cannot be forced
# with tiers a lizard can mount: wherever platforms overlap a lizard hops between them and the
# route search climbs at the earliest legal point, so an ordinary ziggurat gives
# a DIAGONAL up one side. Above 16.4 m nothing can be mounted, so the hairpins are the only way up.
#
# LIFTED FROM 9.6 m TO 17 m (T-624, Ian 2026-10-04: "need their levels lifting higher because lizards are
# evolving to just jump up in one go and skip the running back and forth"; then "Make them 17m"). 9.6 m
# stood on a census of RANDOM lizards (mount topped out at 8.5 m). Twenty generations of selection broke it:
# of the 780 T-624 specialists 318 mount a 9.6 m ledge straight from the floor and the best four mount 12.8 m.
# 17 m STANDS ON THE CEILING, NOT ON A CENSUS. A mount reaches v*v/g, and the launch speed cannot exceed
# 8.0 (the body's cap) x 1.30 (full grip) x 1.22 (the top of the legs_to_jump tower) = 12.69 m/s, so nothing
# this genome can breed mounts more than 16.4 m - measured: all 780 given that launch get onto 16.4 m and
# none onto 16.8 m.
# IF THE BODY CAP, THE GRIP GAIN OR THE TOWER BAND IS RAISED, RE-DERIVE THIS HEIGHT: 17 m stops holding at a
# tower top of 1.25.
# Each hairpin is now 9 rungs 1.7 m apart: four OUT past the tier end, one turning rung directly above the
# fourth, four BACK, the last overlapping the tier above - the same out-and-back shape, taller.
#
# Rungs 12 m wide advancing 10 m - shallow, 2 m overlap (rule 5b; gapped rungs add a
# failure mode and cost 5 DNF in 50 on the High Road). A reversing landing STICKS
# at v=0 (D-138), so the field visibly stops and turns at every hairpin.
# Tier widths 80, 70, 60, 50, 40 m; apex y=85.0, finish at its centre.
# ALL ROCK structure on a DIRT floor (Ian). Death Valley has no water (D-202).
# Name = MEASURED distance: finish_x tuned by probe.

