# Tundra-345 - roster baseline, band 300-400 (T-586 / D-203).
# Ian's spec (stage-roster.xlsx): "rock - dirt - mud - rock - dirt - mud - rock
# - dirt - mud - equal distances". NINE 38.5 m bands - the three-surface cycle
# run three times. No obstacles (D-202), no platforms, no water.
# The corpus's first THREE-surface alternation: wales_335 cycles two (dirt/mud)
# and prices the transition; this cycles all three dry surfaces, so every lizard
# meets its best and worst footing three times each, in the same order, and the
# field re-sorts eight times over the course. Rock is the accel-and-speed tax,
# mud the webbing tax, dirt the neutral breath between them.
# Name = MEASURED distance: 9 x 38.5 = 346.5; finish tuned by probe.

