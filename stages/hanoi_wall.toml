# Hanoi "The Wall" - SIGNATURE (T-586 / D-203), band 200-300.
#
# Roster: "A wall too tall for weak jumpers, with a legal long-way detour; strong
# jumpers go over, the rest sort into the detour." Ian chose the FORK over the
# feat - a wall a large minority clears, so both routes carry a crowd.
#
# THIS IS THE OBSTACLE DONE RIGHT, the counterpart to the Hedgerow. D-210: an
# obstacle cannot be DECLINED, so alone it either does nothing or eliminates.
# Give it a legal detour and it inverts into a ditch-style SELECTOR where failing
# is a survivable cost. The wall is 3.8 m at 2 m wide = 38% clear it (pooled
# obstacle census; at that width 1.8 m is 92%, 5.0 m is 17%, 7.0 m is 3%).
#
# THE DETOUR CLIMBS BACKWARD, AND THAT IS THE WHOLE POINT. Built first with the
# stairs advancing FORWARD 10 m per rung and 50 of 50 took the detour - the wall
# was scenery. The reason is the same one the High Road taught: the route search
# prices a jump as max(air_time, ground_equivalent), so a rung that carries you
# 10 m forward costs almost exactly what WALKING those 10 m costs - a forward
# staircase is a walk with extra steps, and climbing it is free. Turned around,
# the detour runs 42 m BACKWARD to climb, then must re-cover that ground on the
# bridge: ~84 m of wasted horizontal plus 16 m of climbing, against one jump.
# GENERAL RULE: a detour only costs something if it moves you AWAY from the line.
#
# Top rung and bridge are ONE span - two surfaces may not share a y. Rungs 12 m
# wide advancing 10 m (2 m overlap, rule 5b). Rock ground, wood stairs and
# bridge per D-202's Hanoi character.
# Name = MEASURED distance: finish_x tuned by probe.

