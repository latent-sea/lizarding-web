# Death Valley-675 - roster baseline, band 600-700 (T-586 / D-203).
# REBALANCED FLAT (T-659, Ian 2026-10-25: "radically reduce the amount of jumping in the
# stages"). The four decks and their ladders came down to the canyon floor: four long
# hard_rock slabs at grade with dirt breaks between them where the gaps were, so the
# stage keeps its rhythm (slab, break, slab) and nothing on it is jumped. A long flat
# for stayers: rock 87% / dirt 13%, which no other flat carries at this distance
# (DV-575 is 54/46, DV-375 is all rock). No platform, no wall, no ladder: a lizard
# runs every metre. Name = MEASURED distance: finish_x kept from the probed deck build.

