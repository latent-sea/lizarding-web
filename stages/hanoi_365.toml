# Hanoi-365 - roster baseline, band 300-400 (T-586 / D-203).
# REBALANCED FLAT (T-659, Ian 2026-10-25, "radically reduce the amount of jumping"). The
# six towers and their escalating gaps are gone; the six wood roofs lie at grade with the
# rock street showing between them where the gaps were, so the stage keeps its rhythm
# (roof, street, roof). A mid flat where the surface is the sort: wood 73% / rock 27%, a
# mix no other flat carries (hanoi_165 is rock 61 / wood 39 at 158 m). Nothing to mount,
# so nothing is jumped. Name = MEASURED distance: finish_x kept from the probed build.

