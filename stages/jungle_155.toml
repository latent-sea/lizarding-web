# Flat 155 m of mud, nothing else: the band-1 jungle baseline. Measured
# distance target 155 m MEASURED: paddock sits at x=1, so finish_x = 156
# makes the raced start->finish span exactly 155 m (the name is the measured
# distance, not the finish coordinate).

[stage]
