name = "Jungle 155 m"
schema_version = 1
biome_skin = "jungle"
nominal_length_m = 156

[race]
paddock_x = 1.0
paddock_y = 0.0
finish_x = 156
finish_y = 0.0

[[primitives]]
type = "surface"
x_start = 0.0
x_end = 166
y = 0.0
surface_id = "mud"
