# Hanoi-465 - roster baseline, band 400-500 (T-586 / D-203).
# Sheet spec: "Rock then water with wood platforms vertically stacked above the
# rock - repeated a few times". Ian 2026-08-26: towers NARROW and NOT jumpable
# between; the WATER gets platforms decent jumpers can reach; THREE channels.
#   towers    NONE since T-659 (Ian 2026-10-25, "radically reduce the amount of
#             jumping"): the three climbs and the dives off them were five of
#             the eight jumps a race, and a wet stage wants three or fewer.
#   channels  three 26 m water crossings with NO stepping platform (T-659): a
#             lizard leaps at the water and swims the rest, one jump a channel.
#             78 m of water = 17% of the course, a wet stage by the T-658
#             regions, inside Hanoi's small-water character.
#   floor     hard_rock street; flush banks so swimmers glide out.
# Name = MEASURED distance: finish_x tuned by probe. Run-out >= 5 m.

