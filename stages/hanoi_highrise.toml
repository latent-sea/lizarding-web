# Hanoi "The Highrise" - SIGNATURE (T-586 / D-203), band 400-500.
#
# Roster: "A really high platform so falls are really costly - the time of the
# fall, plus the climb back." Ian 2026-08-28: "15m high long with start on it.
# Wood platform. End on wood platform. Rock below. Stepped ladder at end."
#
# THE DECK IS AT 15.0 m AND THAT IS WHAT MAKES A FALL FINAL. Mount-from-floor tops
# out at 8.5 m in the census with NOBODY at 9.0, and the best arc lifts ~6.5 m, so
# nothing climbs back onto the deck where it fell - the stepped ladder at the far
# end is the only way up. Falling is not a detour here, it is an exile.
#
# THE REAL PRICE OF A FALL IS THE SURFACE, not the climb. The deck is WOOD and the
# floor is ROCK, and those are the two ends of the same axis: surface_response is
# claw-driven for both, so a clawed body runs wood at up to 1.30 and rock at 0.70.
# A knocked-down lizard therefore runs the whole remaining course at roughly half
# the speed it had, THEN pays the ladder. That is the cost the roster asks for and
# it needs no gaps in the deck to produce it.
#
# NOTE THIS STAGE IS COMBAT-DRIVEN AND THEREFORE EXEMPT FROM THE ELECTION LAW
# (D-203): nothing here is chosen. The deck is continuous, so the only way down is
# an involuntary knockoff - which is exactly what D-203 anticipates when it says a
# feature relying on involuntary events needs combat traffic at that spot. If the
# probe shows no falls, the feature is inert in a combat-free field and only lives
# in real races.
#
# Ladder climbs LEFTWARD from the floor back onto the deck's right end (9 rungs of
# 1.5 m, 12 m wide advancing 7 m, 5 m overlap - rule 5b).
# Rock ground, wood deck and rungs per D-202's Hanoi character.
# Name = MEASURED distance: finish_x tuned by probe.

