# Jungle-655 - roster baseline, band 600-700 (T-586 / D-203). Ian 2026-08-26:
# the biome's FIRST WATER - "I would like more" - so EIGHT rivers, platform
# crossings gated p50 -> p95 on the +1 m gap census axis (platforms 20 m wood,
# 1 m above the banks; entry gap = the gate, exit is a -1 m drop-gap which every
# entrant can make by physics, so nobody strands). Entry gaps 11/12/13/14/15/16/
# 17/20 m -> river widths 42/44/46/48/50/52/54/60 (396 m of water). Swimmers swim
# bank to bank; the dry field thins river by river to the p95 elite on the last.
# Start: the 355-convention elevated wood platform (first 20%, y=3.0 = pooled
# step-up p90 return gate). Name = MEASURED distance: finish_x tuned by probe.

