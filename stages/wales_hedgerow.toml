# T-658 (Ian, 2026-11-01: "The jumps have to get easier later on... Not too tall at beginning, stayers need to get
# through... about 50% dnf"): hedges 2.6, 2.3, 2.3, 2.0 m, then seventeen at 1.5 m (rung 0 mounts 1.63 m).
# With the drop fully on: 51% finish; by drop third low / mid / high 88 / 59 / 5%.
# The notes below on 1.2 m hedges and on none eliminating are the stage before this change.
#
# T-658 (Ian, 2026-11-01: "I want poor jumpers to fail this one... The jumps have to get easier later on"):
# the first hedge is 3.7 m and the other twenty are 1.5 m. The first is the test: rung 6 (6.4 m/s) and up clear it.
# Rung 0 (4.0 m/s) mounts 1.63 m, so a lizard that has dropped to the bottom still clears the rest.
# With the drop fully on, by starting rung 0-3 / 4-5 / 6-8 / 9+: 0 / 0 / 97 / 100% finish, 65% overall.
# The notes below on 1.2 m hedges and on none eliminating are the stage before this change.
#
# Wales Hedgerow steeplechase - SIGNATURE (T-586 / D-203), band 600-700.
#
# Ledger spec: "low hedges at steady spacing over dirt and mud". 21 hedges at
# 1.2 m, every 23 m, across four mud bogs (two hedges inside each) on dirt.
#
# HONEST NOTE ON THE THESIS (D-210, and Ian's ruling 2026-08-28 to build it as
# is): the ledger called the gate "cumulative jump cost". It is not, and cannot
# be. jump_effort_rate is worth <1% of race time across the whole cohort; the
# landing ceremony is retired (D-156) so a landing costs nothing; and there is
# no windup on the live path. Obstacles ACCELERATE races - a jump arc out-paces
# cruise for 800/800 lizards - so the hedges make this course FAST, not hard.
# What actually sorts the field here is the MUD: surface_response is the one
# live axis on the course. The hedges are character, the bogs are the race.
# Hedges stay at 1.2 m (100% clear rate at 2 m wide) so none of them eliminates
# - a capability-gated obstacle cannot be declined in 2D (authoring rule 9).
#
# Renders as crates until T-588 lands the hedge visual.
# Name = MEASURED distance: finish_x tuned by probe.

