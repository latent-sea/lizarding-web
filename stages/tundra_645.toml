# Tundra-645 - roster baseline, band 600-700 (T-586 / D-203).
# Ian's spec (stage-roster.xlsx): "dirt - mud - rock - repeated 6 times equal
# distances". EIGHTEEN 36.5 m bands - the longest alternation in the corpus, and
# the biome's staying test. No obstacles (D-202), no platforms, no water.
# Every lizard meets each of the three dry surfaces SIX times, in the same
# order, while the fatigue economy runs down underneath - so the same boundary
# that cost nothing at band 3 is being crossed by a much emptier animal at band
# 16. The field re-sorts seventeen times.
# Name = MEASURED distance: 18 x 36.5 = 657; finish tuned by probe.

