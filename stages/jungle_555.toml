# Jungle-555 - roster baseline, band 500-600 (T-586 / D-203).
# REBALANCED FLAT (T-659, Ian 2026-10-25, "radically reduce the amount of jumping"). The
# three bulb trees are gone: the race is the mud floor and its two 25 m glide ponds,
# which every lizard leaps at and swims the rest of (two jumps a race, measured). A long
# flat for stayers on mud: no other flat is mud with ponds at this distance (jungle_155
# is pure mud at 155, jungle_355 has wood). No tree, even out of reach: a lifted canopy
# was measured to cost the sim 5,450 arcs that nobody could take.
# Name = MEASURED distance: finish_x kept from the probed build.

