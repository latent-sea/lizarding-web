x_start = 0.0
x_end = 185
y = 0.0
surface_id = "standard_dirt"

# The stream: 15 m = pooled level-gap p40; bare bank-to-bank jump, flush banks.
[[primitives]]
type = "surface"
x_start = 185
x_end = 200
y = 0.0
surface_id = "water"
