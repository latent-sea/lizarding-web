# Wales-235 - roster baseline, band 200-300 (T-586 / D-203).
# Sheet spec: "80% dirt at beginning 20% mud at end, one obstacle at 40% hedge
# variety" + Ian 2026-08-26: hedge same height as the crate (1.2 x 0.5; hedge
# DISPLAY variant is T-588's lane), and a SMALL STREAM at P40 - gap set at the
# pooled level-gap p40 value (15 m), Ian-confirmed direction: the top 60% jump
# it dry, the bottom 40% swim. Stream sits at the dirt->mud boundary so the
# geography reads: cross the stream into the bog it feeds.
# Name = MEASURED distance: finish_x tuned by probe.

[stage]
id = "wales_235"
name = "Wales 235 m"
schema_version = 1
biome_skin = "wales"
nominal_length_m = 234.4

[race]
