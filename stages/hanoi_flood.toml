# Hanoi "The Flood" - SIGNATURE (T-586 / D-203), band 500-600.
#
# Roster: "Lots of lakes below, scaffold platforms above: jumpers thread the
# network dry, swimmers take the lakes." Ian 2026-08-28: "This is an exception to
# the rule. Hanoi does flood sometimes!" and "I want the platforms to be towers -
# stacks of them spaced periodically so different skilled jumpers can jump
# between them."
#
# D-202 EXCEPTION, RULED BY IAN AND NOT AN AMENDMENT. D-202 gives Hanoi "small
# amounts of water"; this signature is deliberately flooded. The ledger flagged
# the conflict as unresolved and Ian resolved it as a one-stage exception - the
# biome distribution still stands for everything else.
#
# THE TOWERS ARE A GRADED CROSSING. Platforms WIDEN as they rise, so the gap
# between adjacent towers SHRINKS with height - 40 m centres against widths
# 16, 20, 24, 28, 32 m:
#     y= 1.6   width 16.0 m   gap 24.0 m   P95 ~5%
#     y= 3.2   width 20.0 m   gap 20.0 m   ~P80 ~20%
#     y= 4.8   width 24.0 m   gap 16.0 m   P50 ~50%
#     y= 6.4   width 28.0 m   gap 12.0 m   ~P20 ~80%
#     y= 8.0   width 32.0 m   gap  8.0 m   easier than P10 >90%
# So a lizard crosses at the LOWEST level its jump can clear and climbs no higher
# than it must: the elite cross at ground+1.6 on a P95 gap and never climb, the
# weak haul themselves up 8.0 m to take an 8 m hop. Whoever cannot make even
# the top gap goes in the water. Three populations, three routes.
#
# WATER IS A REAL THIRD AXIS here, not a hazard: the swim envelope is a separate
# system from land surface_response, so a swimmer is genuinely fast in the 24 m
# lakes while a clawed jumper is fast on the wood. Every lake is flanked by rock
# islands at the SAME level - you cannot take off from water
# (`reachability.cpp:441`), so a swimmer must be able to WALK out, and it can.
#
# The start apron (0..52) is DRY ROCK - the paddock must stand on solid ground,
# and a field that began in the water would be swimming before it raced.
# Rock ground and islands, wood towers, per D-202's Hanoi character.
# Name = MEASURED distance: finish_x tuned by probe.

