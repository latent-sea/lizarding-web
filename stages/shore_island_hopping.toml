# Shore "Island Hopping" - SIGNATURE (T-586 / D-203), band 500-600.
#
# Roster: "Land, water, land, water - every transition costs an entry and an exit;
# platforms thrown in too." Ian 2026-08-29: "mixed channels - averaging wide -
# only a few platforms - like 4 - make irregular not rhythmic."
#
# ⭐ T-602 IS WHAT MAKES THIS A DECISION STAGE. Before that fix water at grade was
# unjumpable full stop, so alternating land and water AUTOMATICALLY meant a forced
# swim at every channel and the roster's "every transition costs" was guaranteed by
# the engine. It no longer is: a channel under ~24 m can now be leapt. Ian chose
# MIXED over wide-only, so every narrow channel is a live fork - a strong jumper
# stays dry and keeps its land speed, a swimmer takes the water and may gain -
# while the wide ones are still a committed entry and exit.
#
# 6 channels, 22-67 m, mean 45 m ("averaging wide"): 2 are leapable
# (<= 24 m, the pooled P95 level gap), 4 are past any arc in the field and must be
# swum. Widths and island lengths are randomly drawn (seed 586955) so the rhythm
# never establishes - Ian: "irregular not rhythmic". Water is 50% of the course.
#
# FOUR RAISED PLATFORMS (Ian: "like 4"), one at the midpoint of each of the four
# WIDEST channels, wood at 1.6 m. They split an uncrossable channel into two
# halves that a good jumper can take dry - so the widest water is the most
# rewarding to be able to jump, not merely the longest to swim. A SWIMMER CANNOT
# USE THEM: there is no takeoff from water (`reachability.cpp:441`), so a lizard in
# the sea cannot climb a raised platform and simply swims past underneath. That
# asymmetry is the point - the platforms are a jumper's route, not a rest stop.
#
# Wood islands and platforms per D-202's Shore palette (water + wood, no
# obstacles). Shore's visual identity is T-587 (Asa), not settled here.
# Name = MEASURED distance: finish_x tuned by probe.
#
# ⚠ biome_skin is "coast", NOT "shore". The stage IDs are shore_* per the roster, but the
# palette key is D-202's biome name - `biome_palettes.gd` has "coast" and falls back to
# JUNGLE for anything unknown, silently. All six shore_* baselines use "coast".

[stage]
id = "shore_island_hopping"
name = "Shore Island Hopping"
schema_version = 1
biome_skin = "coast"
nominal_length_m = 532

