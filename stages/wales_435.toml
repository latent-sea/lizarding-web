# fully on 73% finish, was 11%; by drop third 94 / 82 / 44%. The heights and widths in the notes below are the stage before.
#
# Wales-435 - roster baseline, band 400-500 (T-586 / D-203).
# Sheet spec: "80% dirt at beginning 20% mud at end, three obstacles at 20% 40%
# 60% hedge variety". Amended by Ian 2026-08-26: keep dry; MORE hedges (six, the
# three were too sparse); hedges 2 m wide, gated P15 rising LINEARLY to P25 -
# heights interpolated off the census width-2 obstacle envelope (clear fractions
# 85%..75%): 2.06/2.13/2.19/2.26/2.33/2.40 m at 12/24/36/48/60/72%. Attrition by
# design: ~15% of a pooled field stops at hedge one, ~25% gone by the last -
# hedges cannot be declined, so the DNFs are the stage's statement (enter the
# wrong lizard and it does not finish). Hedge DISPLAY variant is T-588's lane.
# Name = MEASURED distance: finish_x tuned by probe.

