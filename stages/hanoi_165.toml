# Hanoi-165 - roster baseline, band 100-200 (T-586 / D-203).
# Ian's build ruling 2026-08-26 (the sheet's "50% rock floor then jump up to
# wood platform" let lizards ignore the platform entirely):
#   START ON A ROCK DECK 7 m up, first 50%; WOOD DECK at 8 m for the second 50%
#   (1 m step at the seam - free; the point is the rock->wood SURFACE swap)
#   ROCK FLOOR at y=0 full length; 7 m x 3 m OBSTACLE on it, halfway along the
#   wood deck, so the floor is not a free alternative.
# LADDERS BOTH SIDES OF THE OBSTACLE (Ian, after the first build measured 40%
# DNF - every casualty stalled at the obstacle's near face, unable to remount a
# 7-8 m deck against a measured mount ceiling of 8.5 m). The floor stays useless
# as a ROUTE (slower, and interrupted) but a knockoff now costs time, not the
# race - the v1 rule that a fallen lizard always has a forward path.
#   left ladder  4 treads at 1.4/2.8/4.2/5.6 -> 1.4 m step onto the 7.0 rock deck
#   BOTH LADDERS ARE WOOD (Ian, 2026-08-26) - scaffolding against the stone.
#   right ladder 4 treads at 1.6/3.2/4.8/6.4 -> 1.6 m step onto the 8.0 wood deck
#   both >1 m clear of their deck (the DV-475 near-miss rule)
# Name = MEASURED distance: finish_x tuned by probe. Run-out on the deck.

