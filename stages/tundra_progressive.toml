# Tundra "Progressive" - SIGNATURE (T-586 / D-203), band 200-300.
#
# Roster: "Sparse platform routes gated on jumper ability - big gaps." Ian
# 2026-08-28 chose LOW AND RECOVERABLE over high and final.
#
# THE FALL IS A SETBACK, NOT AN EXILE, AND THAT IS THE POINT OF THIS ONE. The deck
# sits at 1.8 m - the pooled census P10 for a mount-from-floor - so nine in ten
# lizards can climb back on at the next platform. A lizard rides the chain until a
# gap beats it, drops to the slow ground, remounts, and rides again. The field
# shuffles between fast wood and slow ground the whole way instead of being sorted
# once. FIVE existing signatures (Backtrack, High Road, Highrise, Pyramid, Flood)
# all turn on "you cannot get back up"; this is the corpus's counterweight, and
# the variety is the point of T-586. It sorts more softly by design: a weak jumper
# loses time repeatedly rather than being separated decisively.
#
# NOT THE SAME STAGE AS TUNDRA-SINK HOLES, deliberately. Sink holes (300-400) are
# gaps in the GROUND with mud below - the ditch family, drop in and climb out.
# These are gaps in an ELEVATED line with the ground as the fallback. Same word
# "progressive", opposite topology.
#
# GAPS WIDEN STEADILY ACROSS THE PERCENTILES (9 gaps, pooled level-gap census):
#     gap 1:   10 m   P10 90%
#     gap 2:   12 m   ~P20 80%
#     gap 3:   13 m   P25 75%
#     gap 4:   15 m   ~P40 60%
#     gap 5:   16 m   P50 50%
#     gap 6:   18 m   ~P65 40%
#     gap 7:   19 m   P75 25%
#     gap 8:   21 m   ~P85 15%
#     gap 9:   22 m   P90 10%
# so the chain thins continuously - the further along a lizard still holds the
# line, the better its jump. That is what "progressive" means here.
#
# WHY THE DECK IS WORTH HOLDING: wood is the fastest surface a clawed body can run
# (v_mult to 1.30) while the Tundra floor is rock and mud (to 0.70), and a jump arc
# outpaces cruise for 800 of 800 bodies - so riding the chain is quick both on the
# planks and across the gaps. The floor is deliberately the slow option.
# Name = MEASURED distance: finish_x tuned by probe.

