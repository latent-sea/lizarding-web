# Tundra-245 - roster baseline, band 200-300 (T-586 / D-203).
# Ian's spec (stage-roster.xlsx): "dirt - water - dirt - mud - rock - equal
# distances". Five 49 m bands, no obstacles (D-202), no platforms, flush water
# banks.
# PAIRED WITH tundra_145 BY CONSTRUCTION: the same five ingredients in equal
# bands, in a different ORDER - 145 runs rock/mud/dirt/water/dirt and finishes
# on neutral ground, 245 opens on neutral ground, crosses early, and finishes
# on the two hardest surfaces back to back (mud then rock). Any outcome
# difference between the pair is a pure ordering effect, which nothing else in
# the corpus isolates.
# Name = MEASURED distance: finish_x tuned by probe. Run-out >= 5 m.

[stage]
id = "tundra_245"
name = "Tundra 245 m"
schema_version = 1
biome_skin = "tundra"
nominal_length_m = 246

