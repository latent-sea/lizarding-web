# T-658 (Ian, 2026-11-01): ramp treads 1.55 m to 4.65 m, step 1.55 m onto a 6.2 m mesa, walls 5.8 m (rung 0 mounts 1.63 m).
# With the drop fully on 100% finish, was 64%. Heights below are the stage before.
#
# Death Valley-275 - roster baseline, band 200-300 (T-586 / D-203).
# Sheet spec: "100% dirt floor, 80% platform rock", under Ian's option-B ruling:
# rock earns election by being the UNOBSTRUCTED route ("use obstacles to block
# paths below"), blockers at P95 (~5% clear).
#   walls 6.0 m x 2 m  = census pooled clear-rate ~5%
#   mesa y = 6.5       = rock; THE PADDOCK IS ON IT (a stair up from the floor
#                        failed - 5 m treads are too small to mount)
#   SCREE RAMPS        = Ian's ruling (a) after the measured trap (27/50 DNF:
#                        knocked-off lizards died between walls). One ramp per
#                        walled floor section - three 15 m treads rising 1.6
#                        (below the p05 mount floor of 1.8) to 4.8, then a 1.7
#                        step onto the mesa. Every lizard can climb out; the
#                        elite bypass survives; the trap is gone.
# Name = MEASURED distance: finish_x tuned by probe. Run-out >= 5 m.

[stage]
id = "death_valley_275"
name = "Death Valley 275 m"
schema_version = 1
biome_skin = "death_valley"
nominal_length_m = 256

[race]
