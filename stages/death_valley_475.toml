# Death Valley-475 - roster baseline, band 400-500 (T-586 / D-203).
# REBALANCED FLAT (T-659, Ian 2026-10-25, "radically reduce the amount of jumping"). The
# five descending rock platforms, three P95 walls and three escape ramps are gone: the
# race is the dirt floor with two 85 m rock slabs set into it where platforms two and
# four stood. A mid flat for the dirt runner: dirt 60% / rock 40%, a ratio no other Death
# Valley flat carries (175 is 50/50, 375 all rock, 575 is 54/46, 675 is 15/85). No wall:
# a P95 wall cannot be declined on a flat and would DNF the field.
# Name = MEASURED distance: finish_x kept from the probed build.

