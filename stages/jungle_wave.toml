# Jungle-Wave - SIGNATURE, band 300-400 (T-586 / D-203).
# Ledger concept: "Start high, step drops in rhythm down the whole course; mud
# floor." Ian 2026-08-26: 1.6 m gaps - "will start nice and high".
#   staircase  13 wood steps of 22 m, each 1.6 m below the last and
#              separated by a 1.6 m gap. The field starts on the top step at
#              20.8 m - the highest opening in the corpus - and descends in a
#              steady drumbeat to the mud.
#   rhythm     the drops are FREE (falling costs no capability) and the gaps are
#              1.6 m, which every lizard clears - so nothing here gates anyone.
#              The wave is about MOMENTUM, not selection: wood is the fastest
#              surface in the game and mud the slowest, so holding the staircase
#              is simply worth it, and the only way off it is being knocked off.
#   floor      mud the whole length, so a lizard that loses the rhythm finishes
#              slowly rather than not at all. There is no way back up: each step
#              is 1.6 m above the next, but the mud is 20.8 m below the top.
#   contrast   Stepping Stones owns escalation and capability; the Wave owns
#              cadence. Same biome, opposite question.
#   finish     the staircase now ENDS BEFORE THE LINE (Ian: the last platform
#              overshot it), with a 20 m mud run-in - so the last step is the
#              last feature and the line is on open ground.
# Name = MEASURED distance: finish_x tuned by probe.

