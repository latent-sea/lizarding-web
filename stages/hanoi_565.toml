# T-658 (Ian, 2026-11-01): hurdles 0.5 m wide, 1.8, 1.6, 1.5, 1.4, 1.3, then three at 1.2 m, so a lizard that has dropped
# to rung 0 (mounts 1.63 m) still clears the rest. With the drop fully on 99% finish, was 20%. Heights below are the stage before.
#
# Hanoi-565 - roster baseline, band 500-600 (T-586 / D-203).
# Sheet spec: "8 obstacles - random smattering of platforms". Ian 2026-08-26,
# after correcting an earlier misread: obstacles are **P0 to P10** on a linear
# escalation, the platforms are "just random", and THE MAIN ROUTE IS ALONG THE
# BOTTOM.
#   obstacles  eight, 2 m wide, 1.20 -> 1.90 m in equal steps. MEASURED clear
#              rates (width-2 wall): 1.2 m = 100%, 1.8 m = 92%. So they are
#              HURDLES, not gates - the first is free to everyone and the last
#              turns back one lizard in ten. They cost rhythm and time, not
#              places, and cannot trap anyone.
#   platforms  NONE since T-659 (Ian 2026-10-25, "radically reduce the amount of
#              jumping"): the six garnish spans added six hops to the eight hurdles
#              and put the stage in the many-jumps band. The hurdles alone are the
#              stage: eight jumps a race, a few-jumps stage.
#   street     hard_rock, the main line, passable end to end. No ladders and no
#              escape structures are needed: nothing here can strand a lizard.
# An earlier build inverted this - a near-continuous 402 m elevated road plus 48
# ladder treads, 55 wood surfaces over 74% of the course - which made the
# platforms the race and the street a death zone. That is the opposite of the
# brief and is recorded on T-586 as the mistake it was.
# Name = MEASURED distance: finish_x tuned by probe. Run-out >= 5 m.

