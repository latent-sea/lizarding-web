# Jungle-Canopy - SIGNATURE, band 600-700 (T-586 / D-203).
# Ledger concept: high canopy wood route with gaps to hold, over mud; trunk
# climbs let fallen lizards re-ascend. Ian 2026-08-26: two rows, varied spacing,
# "like the monkey one but with a bigger fall - and then the routes up".
# CORRECTED same day, on Ian's reading: a first build seeded the two rows
# INDEPENDENTLY so their gaps never aligned - "making the gaps never line up
# means there is never any big jumps without a second platform to catch them".
# Exactly right: with a catch always available, no gap was ever a real jump.
#   canopy     TWO rows at 9.6 and 11.2 (1.6 apart, a P10 hop between them).
#   safe gaps  WITHIN a section the two rows' gaps are offset and small (7-12 m,
#              level-gap P05-P15) - miss one and the other row catches you. This
#              is the fast, forgiving travelling.
#   ALIGNED BREAKS  five places where BOTH ROWS STOP DEAD, so there is nothing
#              to catch you and the jump is real: 13 / 16 / 19 / 22 / 16 m -
#              level-gap P25 / P50 / P75 / P90 / P50. Miss one and it is a 9.6 m
#              fall to the mud and a slog to the next trunk. These five moments
#              are the stage.
#   trunks     three flush wood columns (rungs 1.6-8.0, then a 1.6 m step onto
#              the canopy), each snapped under a row-A span so the climb always
#              meets something. Sparse: a fall is expensive.
# Name = MEASURED distance: finish_x tuned by probe.

