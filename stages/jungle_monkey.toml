# Jungle-Monkey - SIGNATURE, band 500-600 (T-586 / D-203).
# Ian 2026-08-26: mud floor; platforms placed randomly across the whole course;
# a good jumper finds a route through, a poor one runs the mud. Revised twice:
# 100 platforms, 10 m wide, up to 16 m - then "don't put platforms too close
# together vertically".
#   floor      mud, full length - always available, always slow.
#   platforms  100 wood spans of 10 m on TEN DISCRETE STOREYS at 1.6 m spacing
#              (1.6 / 3.2 / ... / 16.0) - 1.6 m is the pooled step-up P10, so
#              every storey is a clean 90% hop from the one below, and nothing
#              ever sits a few centimetres off a neighbour. An earlier build gave
#              all 100 platforms distinct heights spread over 15 m: consecutive
#              spans landed 0.15 m apart and read as visual noise wherever two
#              overlapped in x.
#              Ten per storey, x random within the storey and never overlapping
#              inside it, so same-y spans are always disjoint (validation rule 2)
#              and the scatter still looks unplanned. Seeded 586901.
#              The 16 m ceiling is well past the 8.5 m mount ceiling, so the
#              upper canopy is reachable only by working up through the lower.
# Name = MEASURED distance: finish_x tuned by probe.

