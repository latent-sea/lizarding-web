# is the trap: rung 0 mounts 1.63 m. With the drop fully on 67% finish, was 29%; by drop third 99 / 79 / 24%. Heights below are the stage before.
#
# Wales-635 - roster baseline, band 600-700 (T-586 / D-203). The TRAP VALLEY, Ian
# 2026-08-26: "it can be a trap but we need a mud gulley where the river is - but the
# finish is at top of the second mountain."
# REBALANCED (T-659, Ian 2026-10-25, "radically reduce the amount of jumping"): the rims
# come down from 18.0 m to 7.2 m. The near wall is TWO free drops of 3.6 m (dirt rim,
# then a mud shelf) to the gully floor; the far wall is FOUR rises of 1.8 m (= pooled
# mount p10, ~90% each) to the finish on the 7.2 m summit (elevated finish, validation
# rule 5). Six jumps a race against nineteen before (a first cut at 9.0 m with three
# drops and five rises measured ten: the field hops more than the shelves count). The
# trap is unchanged: a sub-p10 lizard descends free, swims the river and cannot climb
# out - capability-DNF by design (~10% of a pooled field; Ian accepted the trap
# explicitly). The rims are dirt, the shelves and gully mud. Name = MEASURED distance: finish_x kept from the probed build.

