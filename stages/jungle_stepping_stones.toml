# Jungle-Stepping stones - SIGNATURE, band 400-500 (T-586 / D-203).
# Ledger concept: small platforms over water; a miss lands in the water and
# swims on - jump ability buys SPEED, not survival.
# Ian 2026-08-26, over several passes: vary the jumps; escalate P10 -> P95;
# shape the escalation as an ELBOW two thirds along; and cut the RUN-IN 5x.
#   NOTE ON "RUN-IN": it means the FINAL STRAIGHT to the finish, not the
#   approach to the chain. It was 153 m of mud after the water and is now 31 m -
#   the chain now runs almost to the line, so the last and hardest hops decide
#   the race instead of a long flat gallop afterwards.
#   start      26 m of mud to stand the field up.
#   stones     19 wood platforms, 6 m each, 1.6 m above the water. The chain
#              grew from 14 to 20 to keep the stage in band once the run-in was
#              cut - the extra stones land in the easy section, which lengthens
#              the truce rather than the reckoning.
#   gaps       ELBOW AT STONE 13 (66% along). Hops 1-13 creep P10 -> P25
#              (10-13 m: nine in ten clear them, the field stays whole and
#              fast); hops 14-20 ramp P25 -> P95 (14 -> 24 m) and shed the pack
#              late. Measured against a linear ramp with the same endpoints, the
#              elbow returns the median while keeping the tail - the escalation
#              SHAPE is its own lever.
#   the point  NO JUMP TAKEOFF FROM WATER: a lizard that misses cannot rejoin
#              the chain, it swims the rest. Nobody is eliminated.
# Name = MEASURED distance: finish_x tuned by probe.

